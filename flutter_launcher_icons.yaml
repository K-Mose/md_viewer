# 앱 아이콘 설정 (시안 4번: Playfair Display Black, 검정 배경 + 흰 MD)
# 아이콘 파일은 이미 생성되어 들어가 있음. 원본을 바꿔 다시 만들 때만:
#   flutter pub add dev:flutter_launcher_icons
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  # Android
  android: true                       # 기존 ic_launcher를 덮어씀
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"

  # iOS (App Store는 투명 픽셀이 있으면 거절하므로 알파 제거)
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#000000"

  # Windows
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
